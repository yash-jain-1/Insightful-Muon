# Projects
#   featured: true  → big card with image at the top
#   archived: true  → tucked into the "Older projects" drawer at the bottom
#   (neither)       → regular small card
projects:
  - title: MuDB
    featured: true
    description: A Redis-inspired in-memory cache server in Rust that speaks the RESP protocol. Async networking on Tokio with a framed codec, key-value and list storage, and MULTI/EXEC/DISCARD transactions. Ships with `mudb-cli`, an interactive clap-based client. Dockerised, v0.2.
    tech: [Rust, Tokio, RESP, clap, Docker]
    github: https://github.com/yash-jain-1/muDB

  - title: Panopticon
    featured: true
    status: Design stage
    description: A zero-trust control plane that lets financial AI agents act only within the intent, constraints and risk limits a user approved. The agent proposes and the control plane decides; no order reaches a venue unless a deterministic gateway, holding keys the agent never sees, checks it against a confirmed mandate.
    tech: [Java 21, Spring Boot, FastAPI, PostgreSQL, Docker Compose]

  - title: Shanu Courier Services
    featured: true
    description: Shipment tracking and logistics platform for an Indore courier company. Customers follow parcels on a shipment timeline; admins manage shipments from a JWT-secured dashboard. React on Netlify, Express and MongoDB Atlas on Render.
    tech: [React, Node.js, Express, MongoDB, JWT]
    github: https://github.com/yash-jain-1/Courier-Tracking-Website
    live: https://shanucourier.netlify.app

  - title: Crypto Sentinels
    featured: true
    image: projects/crypto-sentinels.jpg
    description: A toolkit for government agencies to monitor and deanonymize cryptocurrency wallets linked to illegal activity on the dark web, built for Smart India Hackathon 2023 (SIH1445). BERT-based analysis with asynchronous, real-time processing in a stand-alone deployment.
    tech: [TypeScript, Electron, React, MongoDB, Python, AWS EC2]
    github: https://github.com/yash-jain-1/Crypto-Sentinels
    live: https://sentinel.redomic.in/

  - title: BERT4Crypto
    featured: true
    image: projects/bert4crypto.png
    description: A transformer model that identifies fraudulent cryptocurrency transactions and wallets using the Elliptic++ dataset.
    tech: [TensorFlow, Transformers, scikit-learn, Pandas]
    github: https://github.com/yash-jain-1/BERT4Crypto

  - title: Food Ape
    featured: true
    image: projects/food-ape.png
    description: A real-time cross-platform app for ordering food and checking the college hostel mess menu, with secure transactions and a fault-tolerant backend.
    tech: [Flutter, Express, MongoDB, TensorFlow.js]
    github: https://github.com/anantgupta001/FoodApe

  - title: Dark Sentiments
    image: projects/dark-sentiments.png
    description: A scalable, interactive, real-time application for collaborative DSA code sprints with friends, featuring a timer, asynchronous communication, and automated habit tracking.
    tech: [TypeScript, Express, Material Design]

  - title: CodeSpecView
    description: Multi-utility app for 1-on-1 code sprints, with a shared timer, asynchronous chat and automated habit tracking.
    tech: [TypeScript, Express, Material Design]
    github: https://github.com/yash-jain-1/Codespecview

  - title: muonShell
    archived: true
    description: Minimal Unix shell in C with an ncurses interface, a tokenizing parser, built-ins and fork/exec of external programs.
    tech: [C, ncurses]
    github: https://github.com/yash-jain-1/Mu-Shell

  - title: Govt Scheme Mapper
    archived: true
    description: Scrapes and extracts government data to generate insights for targeting welfare schemes using AI.
    tech: [Python, PyTorch, Express, GeoJSON]
    github: https://github.com/yash-jain-1/SchemeMapper

  - title: Rubik's Cube Solver
    archived: true
    description: Models and solves a Rubik's Cube with real move logic and several solving strategies, with a CLI and a 3D visualizer.
    tech: [Python, TypeScript, Three.js]
    github: https://github.com/yash-jain-1/rubiks_cube_solver

  - title: WebPage Element Detect
    archived: true
    description: A YOLO-based computer vision model fine-tuned to recognise elements on a webpage. [Live demo on Hugging Face](https://huggingface.co/spaces/the-insightful-muon/web_element_detection).
    tech: [Python, YOLO, PyTorch]
    github: https://github.com/yash-jain-1/WebPage-Element-Detect/

